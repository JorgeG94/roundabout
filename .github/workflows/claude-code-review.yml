name: Claude Code Review

# On demand only -- never on every push. Two ways to run it:
#   * comment `/claude-review` on a pull request (repo owner/members/
#     collaborators only; the keyword deliberately has no `@claude`, so
#     claude.yml's general assistant does not also fire), or
#   * Actions -> "Claude Code Review" -> Run workflow, with the PR number.
#
# The review itself is the repo's own `pr-review` skill
# (.claude/skills/pr-review/SKILL.md): roundabout's house style plus its
# GPU / MPI / compiler-portability rules, on top of what the hooks and CI check.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number

jobs:
  claude-review:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '/claude-review') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read # lets the review read the PR's CI results
    env:
      PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}

    steps:
      # The PR head, with main beside it, so `git diff origin/main...HEAD`
      # works. Safe to check out PR code here: only trusted commenters can
      # trigger the job, and nothing from the checkout is built or run.
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ env.PR_NUMBER }} of ${{ github.repository }}.
            Follow the repository's pr-review skill exactly: read
            .claude/skills/pr-review/SKILL.md first, then do what it says.
            Read the PR's base branch with `gh pr view`, diff against it,
            take CI results from `gh pr checks`, and do not build or run the
            Fortran tools.

            Tool rules for this run: run every shell command on its own --
            no pipes, `&&`, `;` or redirection, which the allow-list rejects.
            Use the Read/Grep/Glob tools to look at files, not `cat`/`grep`.
            When the report is ready, write it to `review.md` with the Write
            tool, then post it with
            `gh pr comment ${{ env.PR_NUMBER }} --body-file review.md`, and
            put each Must fix finding inline with the inline-comment tool.
            Always post the summary comment, even when you found nothing.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git fetch:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git grep:*),Bash(git ls-files:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
