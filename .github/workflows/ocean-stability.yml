# Tier-2 ocean stability gate.
#
# Runs on a STANDARD GitHub-hosted runner: no NVIDIA hardware, gfortran (not
# NVHPC), 2-4 cores.  That constraint is the whole reason tier 2 exists --
# see tests/regression/README.md "The two tiers".
#
# The toolchain comes from `fortran-lang/setup-fortran`, NOT from apt.  The
# ocean kernels use F2018 `do concurrent` locality specifiers, which GCC
# implements only from 15, and `cmake/toolchain_guards.cmake` fails loud
# below that -- ubuntu-latest's default gfortran is older, so an apt install
# dies at configure.  netcdf-fortran is built here for that exact compiler
# (`tools/build_netcdf_fortran.sh`, ~30 s) because its `.mod` files are
# compiler-specific; apt's libnetcdff is built against apt's gfortran and
# cannot be consumed by GCC 15.  netcdf-c below it is C, so apt's is fine.
# This mirrors portability.yml, which is where the pattern is documented.
#
# What it gates:
#   1. the unit/analytical test suite (`ctest -R rdb`),
#   2. the tier-2 stability sweep -- every shipped ocean namelist run as a
#      dimensionless-number-preserving downscaled twin, asserting no NaN,
#      closed budgets, no energy growth in an unforced case, and bounded CFL.
#
# Tier 1 (full scale, GPU, NVHPC) is NOT wired in here: a hosted runner has no
# GPU.  Run it locally or on a self-hosted GPU box -- see the README.
name: ocean stability (tier 2)

# This is a real gate: it runs on every pull request (49 cases, ~2.5 min wall
# on 4 workers locally).  It was manual-only while it was being proven out;
# that period is over.  `workflow_dispatch` is kept so it can still be run by
# hand from the Actions tab against any branch.
#
# NOTE: no `branches:` filter on pull_request -- deliberately, and for the same
# reason spelled out in pre-commit.yml.  Filtering on [main] means "PRs whose
# BASE is main", which silently skips every PR targeting a long-lived
# integration branch or sitting in a stack.  Those are exactly the PRs a
# stability gate is most useful on.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier2:
    name: gfortran CPU build + tier-2 stability sweep
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Fortran compiler
        uses: fortran-lang/setup-fortran@v1.9.0
        id: setup-fortran
        with:
          compiler: gcc
          version: 15

      - name: Install build tools and netcdf-c
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake ninja-build libnetcdf-dev

      # netcdf-fortran must be built by THIS compiler -- see the header.
      - name: Build netcdf-fortran
        run: |
          tools/build_netcdf_fortran.sh \
            --fc "${{ env.FC }}" \
            --netcdf-c /usr \
            --prefix "$HOME/netcdff"
          echo "RDB_NETCDFF=$HOME/netcdff" >> "$GITHUB_ENV"

      - name: Report toolchain
        run: |
          echo "FC=${{ env.FC }}"
          ${{ env.FC }} --version | head -1
          cmake --version | head -1
          nproc

      # Cache the build tree so the sweep, not the compile, dominates the job.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build_ci
          key: build_ci-${{ runner.os }}-gcc15-${{ hashFiles('CMakeLists.txt', 'src/**/*.F90', 'cmake/**') }}
          restore-keys: |
            build_ci-${{ runner.os }}-gcc15-

      - name: Configure
        run: |
          cmake -B build_ci -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER="${{ env.FC }}" \
            -DCMAKE_PREFIX_PATH="${{ env.RDB_NETCDFF }};/usr" \
            -DRDB_ENABLE_NETCDF=ON \
            -DRDB_ENABLE_GPU=OFF \
            -DRDB_ENABLE_MPI=OFF \
            -DRDB_EXTRA_FORTRAN_FLAGS=-march=x86-64-v3 \
            -DRDB_ENABLE_TESTING=ON

      - name: Build
        run: cmake --build build_ci -j "$(nproc)"

      # Unit + analytical tests.  NEVER `-j N` here: several tests use
      # non-thread-safe HDF5 and the project forbids parallel ctest.
      - name: Unit and analytical tests (ctest -R rdb)
        working-directory: build_ci
        env:
          OMP_NUM_THREADS: "1"
        run: ctest -R rdb --output-on-failure

      # The downscale rules are a manifest-level invariant: a twin that
      # violates them is not the same test as its tier-1 parent, so check
      # them before spending any wallclock on runs.
      - name: Validate tier-2 downscale rules
        run: python3 tests/regression/downscale.py

      # Who tests the test: replays the MEASURED 2026-09-11 failure signatures
      # through the assertions and checks each is classified correctly --
      # including that the weaker gates (an absolute energy ceiling, a
      # whole-run growth fit) genuinely do NOT see the instability, which is
      # why the windowed rate exists. Runs no model; a second or two.
      - name: Self-test the stability assertions
        run: python3 tests/regression/stability.py --self-test

      - name: Tier-2 stability sweep
        env:
          OMP_NUM_THREADS: "1"
        run: |
          python3 tests/regression/stability.py \
            --tier 2 --backend cpu --build-dir build_ci \
            --jobs "$(nproc)" \
            --out tmp_local_artifacts/tier2_results.json

      - name: Upload tier-2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-stability-results
          path: |
            tmp_local_artifacts/tier2_results.json
            tmp_local_artifacts/stability/tier2/**/run.log
          retention-days: 14
          if-no-files-found: warn
