# TEMPORARY diagnostic for #203 (nvfortran 26.9 SIGSEGV in pgf90_lentrima,
# host-CPU dependent). Lives only on the scratch branch ci/nvhpc-debug-203;
# delete the branch when done. Not for merging.
#
# Splits "real memory bug in our code" from "nvfortran -O3 -fast codegen":
#   * Debug   = -g -O0 -Mbounds -Mchkptr -traceback (compiler_flags.cmake)
#   * Release = -O3 -fast, as CI runs today
# Three reps each, to land on both Zen 3 (EPYC 7763) and Zen 5 (EPYC 9V45)
# runners; the Release reps also run the two crashing tests under valgrind.
name: nvhpc debug #203

on:
  push:
    branches: [ci/nvhpc-debug-203]
  workflow_dispatch:

jobs:
  diag:
    name: nvhpc ${{ matrix.build_type }} rep${{ matrix.rep }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Fortran compiler
        uses: fortran-lang/setup-fortran@v1.9.0
        with:
          compiler: nvidia-hpc
          version: latest

      - name: Report toolchain and CPU
        run: |
          ${{ env.FC }} --version || true
          grep -m1 'model name' /proc/cpuinfo || true
          lscpu | grep -E '^(Model name|Flags)' | cut -c1-200 || true

      - name: Install netcdf-c and build netcdf-fortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnetcdf-dev gdb binutils file
          tools/build_netcdf_fortran.sh --fc "${{ env.FC }}" --netcdf-c /usr --prefix "$HOME/netcdff"
          echo "RDB_NETCDFF=$HOME/netcdff" >> "$GITHUB_ENV"

      - name: Configure
        run: >-
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_Fortran_COMPILER=${{ env.FC }}
          -DCMAKE_PREFIX_PATH="${{ env.RDB_NETCDFF }};/usr"
          -DRDB_EXTRA_FORTRAN_FLAGS="-tp=haswell"
          -DRDB_ENABLE_NETCDF=ON -DRDB_ENABLE_MPI=OFF
          -DRDB_ENABLE_GPU=OFF -DRDB_ENABLE_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Crashing test with the NVHPC runtime signal traceback
        working-directory: build
        continue-on-error: true
        env:
          NVCOMPILER_TERM: trace
        run: |
          set +e
          cmd=$(ctest -R '^rdb_test_ocean_vanished_constancy$' -N -V | sed -n 's/.*Test command: //p' | head -1)
          echo "cmd=$cmd"
          (cd "$(dirname "$cmd")" && $cmd) > trace.out 2>&1
          echo "exit=$?"
          tail -n 80 trace.out

      - name: Disassemble the seed -> topo_length_to_grid_units call site
        working-directory: build
        continue-on-error: true
        run: |
          set +e
          lib=$(ls librdb_core.so.* | head -1)
          sym() { nm "$lib" | awk -v n="$1" '$3 == n {print "0x"$1}'; }
          callee=$(sym rdb_ocean_state_topo_length_to_grid_units_)
          caller=$(sym rdb_ocean_state_ocean_state_seed_from_cfg_)
          echo "callee=$callee caller=$caller"
          echo "### callee entry .. +0x40"
          objdump -d --no-show-raw-insn "$lib" --start-address=$((callee)) --stop-address=$((callee + 0x40)) | tail -n +7
          echo "### caller: 0x160 bytes before the return address seed_from_cfg+4216"
          objdump -d --no-show-raw-insn "$lib" --start-address=$((caller + 4216 - 0x160)) --stop-address=$((caller + 4216 + 0x10)) | tail -n +7
          echo "### every call to topo_length_to_grid_units in the library, with the 12 preceding instructions"
          objdump -d --no-show-raw-insn "$lib" | grep -B12 "call.*topo_length_to_grid_units" | head -n 200
