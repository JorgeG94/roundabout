# Roundabout — Spack environment (with MPI)
#
# Provides the system-level toolchain for a multi-GPU / multi-node build.
# Builds OpenMPI if not already available. Fortran dependencies (pic, pic-mpi,
# test-drive) are fetched automatically by CMake FetchContent.
#
# Usage:
#   spack env create rdb-mpi environments/spack_env_mpi.yaml
#   spack env activate rdb-mpi
#   spack install
#
#   cmake -B build -S . -DRDB_ENABLE_MPI=ON
#   cmake --build build
#
# Requires gcc >= 15.x (do concurrent with locality specifiers).
# If your system gcc is older, see spack_env_full.yaml to build gcc from source.

spack:
  specs:
    - "gcc@15:"
    - "cmake@3.25:"
    - openmpi +legacylaunchers
    - netcdf-fortran
    - netcdf-c +mpi ~parallel-netcdf
    - hdf5 +mpi +fortran +hl

  packages:
    c:
      require: "gcc@15:"
    cxx:
      require: "gcc@15:"
    fortran:
      require: "gcc@15:"

  concretizer:
    unify: true
