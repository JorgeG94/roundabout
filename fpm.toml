name = "rdb"
version = "0.1.0"
license = "MIT"
author = "Jorge Luis Galvez Vallejo"
maintainer = "jorgegalvez1694@gmail.com"
copyright = "Copyright 2025, Jorge Luis Galvez Vallejo"
[preprocess]
[preprocess.cpp]
suffixes = ["F90", "f90"]
# Match CMake's default (RDB_ENABLE_DOUBLE=ON) — `wp` is real64.
macros = ["RDB_DOUBLE_PRECISION"]
[build]
auto-executables = false
auto-tests = true
auto-examples = false
module-naming = false
#external-modules = ["mpi_f08", "mpi"]
[[executable]]
name = "rdb"
source-dir = "app"
main = "main.F90"
[[test]]
name = "rdb_tests"
source-dir = "tests"
main = "tester.F90"
[install]
library = true
test = false
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"


[dependencies]
pic = { git = "https://github.com/JorgeG94/pic.git", tag = "v0.9.2"}
pic-mpi = { git = "https://github.com/JorgeG94/pic-mpi.git", tag = "v0.6.3", features=["serial"]}
test-drive = { git = "https://github.com/fortran-lang/test-drive", branch = "main" }
netcdf = "*"
#openmp = "*"
